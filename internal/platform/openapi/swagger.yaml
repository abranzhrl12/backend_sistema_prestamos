        type: string
      grace_days:
        example: 0
        type: integer
      late_fee_amount:
        example: "10.00"
        type: string
      late_fee_mode:
        enum:
        - fixed
        - proportional
        type: string
      late_fee_per_day:
        type: boolean
      max_active_loans_per_customer:
        example: 3
        type: integer
      timezone:
        example: America/Lima
        type: string
