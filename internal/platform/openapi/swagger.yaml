basePath: /api/v1
definitions:
  auth.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        example: admin@acme.com
        type: string
      password:
        example: s3cret
        type: string
      tenant:
        example: acme
        type: string
      transport:
        description: cookie (web) | bearer (default)
        enum:
        - cookie
        - bearer
        example: cookie
        type: string
    required:
    - email
    - password
    type: object
  auth.MeResponse:
    properties:
      must_change_password:
        type: boolean
      roles:
        items:
          type: string
        type: array
      tenant_id:
        type: string
      user_id:
        type: string
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        description: solo para clientes bearer; web usa cookie
        type: string
    type: object
  auth.TokenResponse:
    properties:
      access_expires_at:
        type: string
      access_token:
        type: string
      refresh_expires_at:
        type: string
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  http.BalanceResponse:
    properties:
      as_of:
        type: string
      capital_balance:
        example: "800.00"
        type: string
      lent_outstanding:
        example: "0.00"
        type: string
      movements_count:
        example: 3
        type: integer
      profit_balance:
        example: "200.00"
        type: string
      total_cash:
        example: "1000.00"
        type: string
    type: object
  http.CollectionPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/payments.Collection'
        type: array
      meta:
        $ref: '#/definitions/httpx.PageMeta'
    type: object
  http.CreateTenantRequest:
    properties:
      name:
        example: Acme S.A.C.
        type: string
      owner:
        $ref: '#/definitions/http.OwnerRequest'
      slug:
        example: acme
        type: string
    type: object
  http.CreateTenantResponse:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      id:
        type: string
      name:
        example: Acme S.A.C.
        type: string
      owner:
        $ref: '#/definitions/http.UserSummary'
      slug:
        example: acme
        type: string
      system:
        type: boolean
      temporary_password:
        type: string
      user_count:
        type: integer
    type: object
  http.CreateUserRequest:
    properties:
      email:
        example: cobrador@acme.com
        type: string
      full_name:
        example: Luis Torres
        type: string
      password:
        example: Secreto12345
        type: string
      roles:
        items:
          enum:
          - owner
          - admin
          - cobrador
          - viewer
