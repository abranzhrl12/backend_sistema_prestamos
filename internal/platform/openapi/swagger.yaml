    type: object
  http.TemporaryPasswordResponse:
    properties:
      temporary_password:
        type: string
    type: object
  http.TenantDetail:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      id:
        type: string
      name:
        example: Acme S.A.C.
        type: string
      slug:
        example: acme
        type: string
      system:
        type: boolean
      user_count:
        type: integer
    type: object
  http.TenantPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/http.TenantSummary'
        type: array
      meta:
        $ref: '#/definitions/httpx.PageMeta'
    type: object
  http.TenantSummary:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      id:
        type: string
      name:
        example: Acme S.A.C.
        type: string
      slug:
        example: acme
        type: string
      system:
        type: boolean
    type: object
  http.UpdateTenantRequest:
    properties:
      active:
        type: boolean
      name:
        example: Acme Holding
        type: string
    type: object
  http.UpdateUserRequest:
    properties:
      active:
        type: boolean
      full_name:
        type: string
      password:
        type: string
      roles:
        items:
          type: string
        type: array
    type: object
  http.UserPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/http.UserSummary'
        type: array
      meta:
        $ref: '#/definitions/httpx.PageMeta'
    type: object
  http.UserSummary:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      email:
        example: owner@acme.com
        type: string
      full_name:
        example: Ana Ruiz
        type: string
      id:
        type: string
      roles:
        example:
        - owner
        items:
          type: string
        type: array
    type: object
  http.allocation:
    properties:
      interest:
        type: string
      late_fee:
        type: string
      principal:
        type: string
      schedule_id:
        type: string
    type: object
  http.body:
    properties:
      amount:
        type: string
      distribution:
        $ref: '#/definitions/http.distributionBody'
      parts:
        items:
