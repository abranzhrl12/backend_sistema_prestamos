      first_payment_date:
        type: string
      frequency:
        type: string
      installments_count:
        type: integer
      interest_type:
        type: string
      interest_value:
        type: string
      principal:
        type: string
      term_unit:
        type: string
      term_value:
        type: integer
    type: object
  http.response:
    properties:
      allocations:
        items:
          $ref: '#/definitions/http.allocation'
        type: array
      amount:
        type: string
      id:
        type: string
      loan_id:
        type: string
      paid_at:
        type: string
      parts:
        items:
          $ref: '#/definitions/http.part'
        type: array
      status:
        type: string
    type: object
  http.scheduleResponse:
    properties:
      due_date:
        type: string
      id:
        type: string
      installment_no:
        type: integer
      interest_due:
        type: string
      interest_paid:
        type: string
      late_fee_accrued:
        type: string
      late_fee_paid:
        type: string
      principal_due:
        type: string
      principal_paid:
        type: string
    type: object
  http.simulationRow:
    properties:
      balance:
        type: string
      due_date:
        type: string
      installment_no:
        type: integer
      interest_due:
        type: string
      principal_due:
        type: string
      total_due:
        type: string
    type: object
  httpx.CursorMeta:
    properties:
      has_more:
