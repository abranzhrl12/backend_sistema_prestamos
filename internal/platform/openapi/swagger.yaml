      late_fee_amount:
        example: "10.00"
        type: string
      late_fee_mode:
        type: string
      late_fee_per_day:
        type: boolean
      max_active_loans_per_customer:
        type: integer
      timezone:
        type: string
      updated_at:
        type: string
    type: object
  http.SimulationResponse:
    properties:
      schedule:
        items:
          $ref: '#/definitions/http.simulationRow'
        type: array
      total_due:
        type: string
      total_interest:
        type: string
      total_principal:
        type: string
