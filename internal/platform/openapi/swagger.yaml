      amount_max:
        type: string
      amount_min:
        type: string
      created_at:
        type: string
      fee_type:
        type: string
      fee_value:
        type: string
      frequency:
        type: string
      grace_days:
        type: integer
      id:
        type: string
      interest_type:
        type: string
      late_fee_amount:
        type: string
      late_fee_mode:
        type: string
      late_fee_per_day:
        type: boolean
      name:
        type: string
      rate_default:
        type: string
      rate_max:
        type: string
      rate_min:
        type: string
      rate_period:
        type: string
      terms_max:
        type: integer
      terms_min:
        type: integer
      updated_at:
        type: string
    type: object
  http.ScheduleListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/http.scheduleResponse'
        type: array
    type: object
  http.SettingsRequest:
    properties:
      allocation_order:
        enum:
        - late_fee_interest_principal
        - interest_principal_late_fee
        type: string
      allow_negative_capital:
        type: boolean
      currency:
        enum:
        - PEN
        - USD
