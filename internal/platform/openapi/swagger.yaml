      customer_id:
        type: string
      customer_name:
        type: string
      disbursement_date:
        type: string
      frequency:
        type: string
      id:
        type: string
      interest_type:
        type: string
      interest_value:
        type: string
      principal:
        type: string
      product_id:
        type: string
      rate:
        type: string
      rate_period:
        type: string
      status:
