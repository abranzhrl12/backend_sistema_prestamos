  http.CustomerResponse:
    properties:
      address:
        example: Av. Lima 123
        type: string
      address_reference:
        example: frente al mercado
        type: string
      collector_id:
        type: string
      created_at:
        type: string
      document_id:
        example: "45678912"
        type: string
      email:
        type: string
      full_name:
        example: Juan Pérez
        type: string
      id:
        type: string
      notes:
        type: string
      occupation:
        type: string
      phone:
        example: "987654321"
        type: string
      phone2:
        type: string
      status:
        type: string
      updated_at:
        type: string
      whatsapp:
