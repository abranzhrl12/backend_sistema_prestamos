  payments.Collection:
    properties:
      balance:
        type: string
      customer_name:
        type: string
      due_date:
        type: string
      id:
        type: string
      installment_no:
        type: integer
      interest_balance:
        type: string
      late_fee_balance:
        type: string
      loan_id:
        type: string
      principal_balance:
        type: string
      status:
        type: string
    type: object
  payments.Extension:
    properties:
      additional_interest:
        type: string
      created_at:
        type: string
      first_payment_date:
        type: string
      id:
        type: string
      note:
        type: string
    type: object
info:
  contact:
    name: Soporte Préstamos
  description: |-
    API multitenant para préstamos personales, clientes, caja y cobros.
    Las operaciones protegidas aceptan `Authorization: Bearer <access_token>`.
    La aplicación web también autentica con cookies HttpOnly y exige X-CSRF-Token para mutaciones.
  title: Préstamos API
  version: 1.1.0
paths:
  /admin/tenants:
    get:
      parameters:
      - description: slug o nombre
        in: query
        name: q
        type: string
      - description: true|false
        in: query
        name: active
        type: boolean
      - description: 1-100 (def. 20)
        in: query
        name: limit
        type: integer
      - description: desplazamiento
        in: query
        name: offset
        type: integer
      - description: calcular total exacto (más lento)
        in: query
        name: include_total
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TenantPageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar empresas (solo superadmin)
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: empresa y owner
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.CreateTenantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.CreateTenantResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Crear empresa con su owner (solo superadmin)
      tags:
      - admin
  /admin/tenants/{id}:
    delete:
      parameters:
      - description: ID de la empresa
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 'Eliminar empresa (soft delete): bloquea sus logins y cierra sus sesiones
        (solo superadmin)'
      tags:
      - admin
    get:
      parameters:
      - description: ID de la empresa
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TenantDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Obtener empresa con su número de usuarios
      tags:
      - admin
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID de la empresa
        in: path
        name: id
        required: true
        type: string
      - description: campos a cambiar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.UpdateTenantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TenantDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cambiar nombre y/o estado de la empresa (desactivar corta su acceso)
      tags:
      - admin
  /admin/tenants/{id}/restore:
    post:
      parameters:
      - description: ID de la empresa
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TenantDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restaurar empresa eliminada (solo superadmin)
      tags:
      - admin
  /admin/tenants/{id}/users:
    get:
      parameters:
      - description: ID de la empresa
        in: path
        name: id
        required: true
        type: string
      - description: correo o nombre
        in: query
        name: q
        type: string
      - description: true|false
        in: query
        name: active
        type: boolean
      - description: 1-100 (def. 20)
        in: query
        name: limit
        type: integer
      - description: desplazamiento
        in: query
        name: offset
        type: integer
      - description: calcular total exacto (más lento)
        in: query
        name: include_total
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.UserPageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar usuarios de una empresa (solo superadmin)
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: ID de la empresa
        in: path
        name: id
        required: true
        type: string
      - description: datos del usuario
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.UserSummary'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
