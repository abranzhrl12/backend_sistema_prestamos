# BD temporal SOLO para pruebas e2e / rendimiento.
# Los datos viven en RAM (tmpfs): al bajar el contenedor no queda nada.
# Lo levanta y lo borra automáticamente tests/testenv (docker compose up/down -v).
name: prestamos-test

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: prestamos_test
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prestamos_test"]
      interval: 1s
      timeout: 3s
      retries: 30
